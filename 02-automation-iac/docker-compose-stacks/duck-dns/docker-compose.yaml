name: duckdns
services:
  duckdns:
    cpu_shares: 90
    command: []
    container_name: duckdns
    deploy:
      resources:
        limits:
          memory: 3784M
    environment:
      - LOG_FILE=false
      - PGID=1000
      - PUID=1000
      - SUBDOMAINS=<YOUR_SUBDOMAIN
      - TOKEN=c403d9ac-0f59-40ec-87ce-fb5dd4e90c9e
      - TZ=America/Sao_Paulo
      - UPDATE_IP=ipv6
    hostname: duckdns
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS https://www.duckdns.org > /dev/null || exit 1
      timeout: 10s
      interval: 30m0s
      retries: 3
    image: lscr.io/linuxserver/duckdns:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/DuckDNS/icon.png
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/duckdns
        target: /config
        bind:
          create_host_path: true
    ports: []
    devices: []
    cap_add: []
    network_mode: host
    privileged: false
